<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空洞骑士五成就速通视频合集</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #111; color: #eee; }
  h1 { text-align: center; }
  .video-list { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .video-btn { padding: 10px 18px; background: #333; border: 2px solid transparent; color: #eee; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .video-btn:hover { background: #444; }
  .video-btn.active { border-color: #ff5252; background: #500; }
  video { width: 100%; border-radius: 8px; }
</style>
</head>
<body>
<h1>空洞骑士五成就速通视频合集</h1>
<div class="video-list" id="videoList"></div>
<video id="video" controls></video>

<script>
// 视频列表配置 —— 后续加新视频只需在这里加一行
const videos = [
  { title: "第1集", src: "./speedrun_5/1/playlist.m3u8" },
  { title: "第2集", src: "./speedrun_5/2/playlist.m3u8" },
  { title: "第3集", src: "./speedrun_5/3/playlist.m3u8" },
  { title: "第4集", src: "./speedrun_5/4/playlist.m3u8" },
  { title: "第5集", src: "./speedrun_5/5/playlist.m3u8" },
  // 以后新增：{ title: "第6集", src: "./speedrun_5/6/playlist.m3u8" },
];

const video = document.getElementById('video');
const listEl = document.getElementById('videoList');

// 动态生成按钮
videos.forEach((v, i) => {
  const btn = document.createElement('button');
  btn.className = 'video-btn' + (i === 0 ? ' active' : '');
  btn.textContent = v.title;
  btn.onclick = () => {
    document.querySelectorAll('.video-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    playVideo(v.src);
  };
  listEl.appendChild(btn);
});

// 播放函数
function playVideo(src) {
  if (Hls.isSupported()) {
    if (window.hls) window.hls.destroy();
    window.hls = new Hls();
    window.hls.loadSource(src);
    window.hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
  }
}

// 默认播放第一个
playVideo(videos[0].src);
</script>
</body>
</html>
